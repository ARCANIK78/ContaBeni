services:
  db:
    image: postgres:16-alpine
    container_name: contabeni-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contabeni
    ports:
      - '5432:5432'
    volumes:
      - contabeni_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contabeni_pgdata: